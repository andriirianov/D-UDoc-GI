        nichtbeurteilbar: 'Nicht beurteilbar'
      };

      // Kopfzeile
      let html = `
        <h1>Evaluation der Urteilsfähigkeit (U-Doc)</h1>
        <div class="print-meta">
          <table>
            <tr><td>Beurteilende Person(en):</td><td>${esc(m.examiners || '—')}</td></tr>
            <tr><td>Datum der Beurteilung:</td><td>${esc(m.assessmentDate ? formatDateDE(m.assessmentDate) : '—')}</td></tr>
            <tr><td>Ort:</td><td>${esc(m.assessmentLocation || '—')}</td></tr>
            <tr><td style="border-top:0.5pt solid #ddd"></td><td style="border-top:0.5pt solid #ddd"></td></tr>
            ${patientName ? `<tr><td>Patient/in:</td><td>${esc(patientName)}</td></tr>` : ''}
            ${m.patientDOB     ? `<tr><td>Geburtsdatum:</td><td>${esc(formatDateDE(m.patientDOB))}</td></tr>` : ''}
            ${m.patientRef     ? `<tr><td>Kürzel / Fallnummer:</td><td>${esc(m.patientRef)}</td></tr>` : ''}
            ${m.patientAddress ? `<tr><td>Anschrift:</td><td style="white-space:pre-wrap">${esc(m.patientAddress)}</td></tr>` : ''}
            <tr><td style="border-top:0.5pt solid #ddd"></td><td style="border-top:0.5pt solid #ddd"></td></tr>
            <tr><td>Beurteilung:</td><td>${m.isFirstAssessment ? 'Erstbeurteilung' : 'Folgebeurteilung'}</td></tr>
          </table>
        </div>`;

      // Ausgangslage
      if (m.referenceDecision.trim()) {
        html += `<h2>Ausgangslage</h2>
          <div class="print-text">${esc(m.referenceDecision.trim())}</div>`;
      }

      // Bisherige Sitzungen
      if (!m.isFirstAssessment && m.priorSessions.length > 0) {
        html += `<h2>Bisherige Sitzungen</h2>
          <table>
            <thead><tr><th>#</th><th>Datum</th><th>Beurteilende Person(en)</th><th>Ergebnis</th></tr></thead>
            <tbody>
              ${m.priorSessions.map((s, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td>${esc(formatDateDE(s.date))}</td>
                  <td>${esc(s.examiner)}</td>
                  <td>${esc(s.result)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }

      // Bereiche (strukturierte Übersicht mit Donut-Diagrammen E3 + E4)
      html += `<div class="print-donut-row">`;
      udocCore.areas.forEach(area => {
        const summ = state.areaSummaries[area.id];
        const summId = summ ? summ.summaryId : null;
        const summLabel = summId ? (area.summaryScale.find(s => s.id === summId)?.label || summId) : '—';
        html += `<div class="print-donut-cell">
          <div class="print-area-title">${esc(area.label)}</div>
          ${renderAreaChart(area.id, { forPrint: true })}
          <div class="print-area-summary-label">${esc(summLabel)}</div>
        </div>`;
      });
      // Modul-Bereiche: je Bereich ein Donut
      for (const modId of (state.meta.activeModules || [])) {
        const mod = extensionModules[modId];
        if (!mod || !mod.extraAreas) continue;
        mod.extraAreas.forEach(area => {
          const summ = state.areaSummaries[area.id];
          const summId = summ ? summ.summaryId : null;
          const summLabel = summId ? (area.summaryScale.find(s => s.id === summId)?.label || summId) : '—';
          html += `<div class="print-donut-cell">
            <div class="print-area-title">${esc(area.label)}</div>
            ${renderAreaChart(area.id, { forPrint: true })}
            <div class="print-area-summary-label">${esc(summLabel)}</div>
          </div>`;
        });
      }
      html += `</div>`;

      // Kriterientabellen pro Bereich
      udocCore.areas.forEach(area => {
        html += `<h2 class="print-area-h2">${esc(area.label)}</h2>
          <table>
            <thead><tr><th>Kriterium</th><th>Beurteilung</th></tr></thead>
            <tbody>`;
        area.criteria.forEach(c => {
          const ans = state.criterionAnswers[c.id];
          const opt = ans ? ans.option : null;
          const ansLabel = opt ? (CRITERION_OPTIONS.find(o => o.id === opt)?.label || opt) : 'offen';
          const showBegruendung = (opt === 'beeintraechtigt' || opt === 'nichtbeurteilbar') && ans.begruendung && ans.begruendung.trim();
          html += `<tr><td>${esc(getEffectiveCriterionDef(c.id)?.label || c.label)}</td><td><em>${esc(ansLabel)}</em>${showBegruendung ? `<br><span style="font-style:normal;font-size:8pt;color:#444">Begründung: ${esc(ans.begruendung.trim())}</span>` : ''}</td></tr>`;
        });
        html += `</tbody></table>`;
        const summ = state.areaSummaries[area.id];
        const summId = summ ? summ.summaryId : null;
        const summLabel = summId ? (area.summaryScale.find(s => s.id === summId)?.label || summId) : 'offen';
        html += `<p style="margin-bottom:2pt"><strong>Gesamtbeurteilung:</strong> ${esc(summLabel)}</p>`;
        const desc = summ ? (summ.description || '').trim() : '';
        if (desc) html += `<div class="print-text" style="margin-top:4pt">${esc(desc)}</div>`;
      });

      // Erweiterungsmodul-Kriterientabellen
      const activeModAreas = (state.meta.activeModules || []).flatMap(modId =>
        extensionModules[modId]?.extraAreas || []
      );
      if (activeModAreas.length > 0) {
        html += `<h2 class="print-area-h2" style="margin-top:14pt">Erweiterungsbereiche</h2>`;
        activeModAreas.forEach(area => {
          html += `<h2 class="print-area-h2">${esc(area.label)}</h2>
            <table>
              <thead><tr><th>Kriterium</th><th>Beurteilung</th></tr></thead>
              <tbody>`;
          area.criteria.forEach(c => {
            const ans = state.criterionAnswers[c.id];
            const opt = ans ? ans.option : null;
            const ansLabel = opt ? (CRITERION_OPTIONS.find(o => o.id === opt)?.label || opt) : 'offen';
            const showBegruendung = (opt === 'beeintraechtigt' || opt === 'nichtbeurteilbar') && ans.begruendung && ans.begruendung.trim();
            html += `<tr><td>${esc(c.label)}</td><td><em>${esc(ansLabel)}</em>${showBegruendung ? `<br><span style="font-style:normal;font-size:8pt;color:#444">Begründung: ${esc(ans.begruendung.trim())}</span>` : ''}</td></tr>`;
          });
          html += `</tbody></table>`;
          const summ = state.areaSummaries[area.id];
          const summId = summ ? summ.summaryId : null;
          const summLabel = summId ? (area.summaryScale.find(s => s.id === summId)?.label || summId) : 'offen';
          html += `<p style="margin-bottom:2pt"><strong>Gesamtbeurteilung:</strong> ${esc(summLabel)}</p>`;
          const desc = summ ? (summ.description || '').trim() : '';
          if (desc) html += `<div class="print-text" style="margin-top:4pt">${esc(desc)}</div>`;
        });
      }

      // SAMW-Klinische Einschätzung — nur drucken, wenn ausgefüllt
      const sa = state.samwAlgorithm;
      const SAMW_LABELS_PRINT = { ja: 'Ja', nein: 'Nein' };
      if (sa.step2) {
        html += `<div style="margin-top:12pt;border-top:0.5pt solid #ccc;padding-top:8pt"></div>
          <h2>Klinische Einschätzung</h2>
          <div class="samw-box">
            <div class="samw-step"><strong>Signifikanz der Beeinträchtigungen:</strong> ${esc(SAMW_LABELS_PRINT[sa.step2])}</div>
            ${sa.step2 === 'ja' && sa.step3 ? `<div class="samw-step"><strong>Aufgewogen durch intakte Fähigkeiten:</strong> ${esc(SAMW_LABELS_PRINT[sa.step3])}</div>` : ''}
          </div>`;
      }

      // Gesamturteil — hervorgehobene Box (E2)
      html += `<h2>Gesamturteil</h2>`;
      const verdictLabel = conclusion.verdict ? (VERDICT_LABELS_PRINT[conclusion.verdict] || conclusion.verdict) : '—';
      const verdictColor = conclusion.verdict === 'urteilsfaehig'   ? '#d4edda'
                         : conclusion.verdict === 'urteilsunfaehig' ? '#f8d7da'
                         : '#fff3cd';
      const verdictBorder = conclusion.verdict === 'urteilsfaehig'   ? '#28a745'
                          : conclusion.verdict === 'urteilsunfaehig' ? '#dc3545'
                          : '#ffc107';
      html += `<div class="print-verdict-box" style="background:${verdictColor};border-left:3pt solid ${verdictBorder}">
        <span class="print-verdict-label">Urteil:</span>
        <span class="print-verdict-value">${esc(verdictLabel)}</span>
      </div>`;

      if (conclusion.verdict === 'urteilsunfaehig' && conclusion.legalGround) {
        const lg = LEGAL_GROUNDS.find(g => g.id === conclusion.legalGround);
        html += `<p><strong>Ursache der Urteilsunfähigkeit:</strong> ${esc(lg ? lg.label : conclusion.legalGround)}</p>`;
        if (conclusion.legalDetail) html += `<p><strong>Spezifizierung:</strong> ${esc(conclusion.legalDetail)}</p>`;
      }

      if (conclusion.reasoning.trim()) {
        html += `<h3>Abschliessende Begründung</h3>
          <div class="print-text">${esc(conclusion.reasoning.trim())}</div>`;
      }

      // Befundtext — neue Seite, kompakter Patientenstreifen, nur body aus buildEndbefund() (D2, D4)
      const befund = buildEndbefund();
      if (befund.body.trim()) {
        const patientStrip = [
          patientName || m.patientRef || null,
          m.patientDOB ? 'geb. ' + formatDateDE(m.patientDOB) : null,
          m.patientRef && patientName ? m.patientRef : null
        ].filter(Boolean).join(' · ');
        html += `<div class="print-befund-section">
          ${patientStrip ? `<div class="print-patient-strip">${esc(patientStrip)}</div>` : ''}
          <h2 style="margin-top:8pt">Befundtext</h2>
          <div class="print-text">${esc(befund.body)}</div>
        </div>`;
      }

      // Patientenorientierte Information (dynamisch je nach aktiven Modulen)
      const coreAreaLabels = 'Erkenntnisfähigkeit, Wertungsfähigkeit sowie Willensbildung und -umsetzung';
      const activeModIds = state.meta.activeModules || [];
      let assessmentMethodText;
      if (activeModIds.length === 0) {
        assessmentMethodText = 'Die Beurteilung erfolgte anhand von drei Bereichen mit je vier Kriterien: ' + coreAreaLabels + '.';
      } else {
        const modLabels = activeModIds
          .map(modId => extensionModules[modId]?.label)
          .filter(Boolean)
          .join(', ');
        assessmentMethodText = 'Die Beurteilung erfolgte anhand der etablierten Kriterien zur Beurteilung der Urteilsfähigkeit (' + coreAreaLabels + '), ergänzt um kontextspezifische Bereiche zu ' + modLabels + '.';
      }
      html += `
        <div class="patient-info-box">
          <strong>Information zur Dokumentation:</strong><br>
          Diese Dokumentation hält fest, wie die Urteilsfähigkeit hinsichtlich der vorliegenden Entscheidung beurteilt wurde. ${esc(assessmentMethodText)} Das Ergebnis bezieht sich ausschliesslich auf die dokumentierte Entscheidungssituation und ist nicht als allgemeine Aussage über die Persönlichkeit oder Kompetenz der untersuchten Person zu verstehen.
        </div>`;

      // Persönliche Erklärung
      if (conclusion.declaration) {
        html += `<p style="margin-top:10pt;font-size:9pt;color:#333;font-style:italic">
          Ich bestätige, meine eigenen Werthaltungen und mögliche Interessenkonflikte kritisch reflektiert zu haben und keine Befangenheit zu erkennen, die die vorliegende Beurteilung wesentlich beeinflusst hätte.
        </p>`;
      }

      // Unterschriftsfelder — Ort + Datum aus state (D3)
      const sigName = m.examiners
        ? m.examiners.split('\n').map(l => esc(l.trim())).filter(Boolean).join('<br>')
        : 'Beurteilende Person';
      const sigLocation = [m.assessmentLocation, m.assessmentDate ? formatDateDE(m.assessmentDate) : null].filter(Boolean).join(', ');
      html += `
        <div class="sig-block" style="margin-top:16pt">
          <table style="border:none;width:100%">
            <tr>
              <td style="border:none;padding:0;width:55%;vertical-align:bottom">
                <div class="sig-line"></div>
                <p style="font-size:8pt;color:#666;margin-top:3pt">${sigName}</p>
              </td>
              <td style="border:none;padding:0;width:10%"></td>
              <td style="border:none;padding:0;width:35%;vertical-align:bottom">
                <div class="sig-line" style="width:100%;display:block"></div>
                <p style="font-size:8pt;color:#666;margin-top:3pt">${esc(sigLocation || 'Ort, Datum')}</p>
              </td>
            </tr>
          </table>
        </div>`;

      return html;
    }

    /* ============================================================
       HILFSFUNKTIONEN
       ============================================================ */

    /* HTML-Sonderzeichen escapen */
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ISO-Datum (YYYY-MM-DD) in Schweizer/deutsches Format (DD.MM.YYYY).
       Fallback: ursprünglichen String zurückgeben, wenn nicht parsebar. */
    function formatDateDE(iso) {
      if (!iso || typeof iso !== 'string') return iso || '';
      const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso;
      return m[3] + '.' + m[2] + '.' + m[1];
    }

    /* ============================================================
       SCHRIFTGRÖSSEN-STEUERUNG
       ============================================================ */

    /* Skalierungsstufen — 100 % entspricht der Standardansicht */
    const FONT_SCALE_STEPS = [0.9, 1.0, 1.1, 1.25, 1.4];
    let fontScaleIndex = 1; // Index 1 = 1.0 = Standard

    /* Aktuelle Skalierung anwenden und Schaltflächen-Zustand aktualisieren */
    function applyFontScale() {
      const scale = FONT_SCALE_STEPS[fontScaleIndex];
      // Skaliert die gesamte Bildschirmansicht; im Druck via @media print zurückgesetzt
      document.documentElement.style.zoom = scale;

      const decBtn   = document.getElementById('fs-decrease');
      const incBtn   = document.getElementById('fs-increase');
      const resetBtn = document.getElementById('fs-reset');
      if (decBtn) decBtn.disabled = (fontScaleIndex === 0);
      if (incBtn) incBtn.disabled = (fontScaleIndex === FONT_SCALE_STEPS.length - 1);
      if (resetBtn) {
        resetBtn.title = 'Standardgrösse — aktuell ' + Math.round(scale * 100) + ' %';
      }
    }

    /* Schrift um eine Stufe vergrössern (+1) oder verkleinern (-1) */
    function changeFontSize(direction) {
      const next = fontScaleIndex + direction;
      if (next < 0 || next > FONT_SCALE_STEPS.length - 1) return;
      fontScaleIndex = next;
      applyFontScale();
    }

    /* Schriftgrösse auf Standard zurücksetzen */
    function resetFontSize() {
      fontScaleIndex = 1;
      applyFontScale();
    }

    /* ============================================================
       J. INITIALISIERUNG
       ============================================================ */
    function init() {
      initState();
      render();
      applyFontScale();
    }

    // Anwendung starten
    init();
  </script>
</body>
</html>
